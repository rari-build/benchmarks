catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - rari-darwin-arm64@0.17.11
  - rari-darwin-x64@0.17.11
  - rari-linux-arm64@0.17.11
  - rari-linux-x64@0.17.11
  - rari-win32-arm64@0.17.11
  - rari-win32-x64@0.17.11
  - rari@0.17.11
  - '@rari/lint@0.2.0'

shellEmulator: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - tsrs@7.1.0-beta.tsrs2

packages:
  - apps/nextjs
  - apps/rari
  - shared

catalogs:
  build:
    vite-plus: ^1.7.0
  default:
    '@rari/lint': ^0.2.0
    rari: ^0.17.11
  eslint:
    eslint: ^10.15.0
    knip: ^6.46.1
  md:
    markdown-it: ^15.0.3
  nextjs:
    next: ^16.4.6
  react:
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    react: ^19.3.1
    react-dom: ^19.3.1
  tailwind:
    '@tailwindcss/postcss': ^4.3.5
    '@tailwindcss/vite': ^4.3.5
    tailwindcss: ^4.3.5
  typescript:
    '@types/node': ^26.6.6
    # https://devblogs.microsoft.com/typescript/announcing-typescript-7-0/#running-side-by-side-with-typescript-6.0
    typescript: npm:@typescript/typescript6@^6.0.2
    typescript-7: npm:typescript@^7.0.2

allowBuilds:
  sharp: true
